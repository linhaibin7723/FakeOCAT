name: Release

# ── 触发条件 ──
on:
  # 推送以 v 开头的 Tag 时自动触发
  push:
    tags:
      - 'v*'
  # 支持手动触发（可指定 tag）
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本 Tag（例如 v1.0.1）'
        required: true
        type: string

# 撤销同一流水线的旧运行（例如连续推送多个 tag 时）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # 覆盖 gradle.properties 中硬编码的本地 JDK 路径
  org.gradle.java.home: ''

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release 并上传 Asset 所需

    steps:
      # ── 1. 确定发布版本号 ──
      - name: 解析版本号
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # 去掉 v 前缀得到纯版本号
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # ── 2. 检出代码 ──
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      # ── 3. 设置 JDK 21 ──
      # Gradle 9.x 要求最低 JDK 21；compileOptions 中的 Java 17 目标与之兼容
      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ── 4. 安装 Android SDK ──
      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35'

      # ── 5. 配置 Gradle 缓存 ──
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── 6. 解码并写入签名密钥 ──
      - name: 解码签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/keystore.jks

      # ── 7. 构建签名 Release APK ──
      - name: 授予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建 Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # ── 8. 提取 CHANGELOG 中对应版本的 Release Notes ──
      - name: 提取 Release Notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 使用 awk 提取 [x.y.z] 到下一个 ## 之间的内容
          awk -v ver="$VERSION" '
            /^\[/ && index($0, "[" ver "]") > 0 { found=1; next }
            found && /^\[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          # 如果提取结果为空，使用默认文本
          if [ ! -s release-notes.md ]; then
            echo "Release ${{ steps.version.outputs.tag }}" > release-notes.md
          fi

      # ── 9. 创建 GitHub Release 并上传 APK ──
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
