# 项目级 Gradle 设置。
# IDE（如 Android Studio）用户须知：
# 通过 IDE 配置的 Gradle 设置*会覆盖*本文件中的任何设置。
# 有关如何配置构建环境的更多详情，请访问
# http://www.gradle.org/docs/current/userguide/build_environment.html
# 指定守护进程使用的 JVM 参数。
# 该设置对于调整内存设置尤为有用。
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# 强制 Gradle 使用 Android Studio 自带的 JBR（JDK 21），而非 VS Code Red Hat Java 扩展的精简版 JDK
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
# ↑ 本地开发机 JDK 路径，CI 中由 ANDROID_CI_JAVA_HOME 环境变量覆盖

# 开启后，Gradle 将以孵化的并行模式运行。
# 此选项仅应与解耦项目一起使用。更多详情请访问
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
kotlin.code.style=official

android.useAndroidX=true
android.enableJetifier=false
android.uniquePackageNames=false
android.dependency.useConstraints=true

# 防止 project import 性能警告
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false